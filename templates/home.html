<!doctype html>
<html>
  <head>
    <title>Boston House Price Prediction</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
      }

      .container {
        width: 700px;
        margin: 40px auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        color: #2c3e50;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }

      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background-color: #2980b9;
      }

      .prediction {
        text-align: center;
        margin-top: 20px;
        color: green;
        font-size: 22px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🏠 Boston House Price Prediction</h1>

      <form action="{{ url_for('predict') }}" method="post">
        <div class="form-group">
          <label>Crime Rate (CRIM)</label>
          <input type="text" name="CRIM" required />
        </div>

        <div class="form-group">
          <label>Residential Land Zoned Percentage (ZN)</label>
          <input type="text" name="ZN" required />
        </div>

        <div class="form-group">
          <label>Non-Retail Business Acres (INDUS)</label>
          <input type="text" name="INDUS" required />
        </div>

        <div class="form-group">
          <label>Charles River Dummy Variable (CHAS)</label>
          <input type="text" name="CHAS" required />
        </div>

        <div class="form-group">
          <label>Nitric Oxides Concentration (NOX)</label>
          <input type="text" name="NOX" required />
        </div>

        <div class="form-group">
          <label>Average Number of Rooms (RM)</label>
          <input type="text" name="RM" required />
        </div>

        <div class="form-group">
          <label>Age of Property (%) (AGE)</label>
          <input type="text" name="AGE" required />
        </div>

        <div class="form-group">
          <label>Distance to Employment Centers (DIS)</label>
          <input type="text" name="DIS" required />
        </div>

        <div class="form-group">
          <label>Accessibility to Highways (RAD)</label>
          <input type="text" name="RAD" required />
        </div>

        <div class="form-group">
          <label>Property Tax Rate (TAX)</label>
          <input type="text" name="TAX" required />
        </div>

        <div class="form-group">
          <label>Pupil-Teacher Ratio (PTRATIO)</label>
          <input type="text" name="PTRATIO" required />
        </div>

        <div class="form-group">
          <label>Black Population Index (B)</label>
          <input type="text" name="B" required />
        </div>

        <div class="form-group">
          <label>Lower Status Population (%) (LSTAT)</label>
          <input type="text" name="LSTAT" required />
        </div>

        <button type="submit">Predict House Price</button>
      </form>

      <div class="prediction">
        {% if prediction_text %} {{ prediction_text }} {% else %} Enter the
        feature values and click "Predict House Price" {% endif %}
      </div>
    </div>
  </body>
</html>
