<!doctype html>
<html>
  <head>
    <title>Boston House Price Prediction</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
      }

      .container {
        width: 700px;
        margin: 40px auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        color: #2c3e50;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }

      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box; /* Ensures padding doesn't affect width */
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
      }

      button:hover {
        background-color: #2980b9;
      }

      .prediction {
        text-align: center;
        margin-top: 20px;
        color: green;
        font-size: 22px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🏠 Boston House Price Prediction</h1>

      <form action="{{ url_for('predict') }}" method="post">
        <div class="form-group">
          <label>Crime Rate (CRIM) [0 - 90]</label>
          <input
            type="number"
            step="any"
            min="0"
            max="90"
            name="CRIM"
            required
          />
        </div>

        <div class="form-group">
          <label>Residential Land Zoned Percentage (ZN) [0 - 100]</label>
          <input
            type="number"
            step="any"
            min="0"
            max="100"
            name="ZN"
            required
          />
        </div>

        <div class="form-group">
          <label>Non-Retail Business Acres (INDUS) [0 - 30]</label>
          <input
            type="number"
            step="any"
            min="0"
            max="30"
            name="INDUS"
            required
          />
        </div>

        <div class="form-group">
          <label>Charles River Dummy Variable (CHAS) [0 or 1]</label>
          <input type="number" min="0" max="1" name="CHAS" required />
        </div>

        <div class="form-group">
          <label>Nitric Oxides Concentration (NOX) [0.3 - 0.9]</label>
          <input
            type="number"
            step="any"
            min="0.3"
            max="0.9"
            name="NOX"
            required
          />
        </div>

        <div class="form-group">
          <label>Average Number of Rooms (RM) [3 - 9]</label>
          <input type="number" step="any" min="3" max="9" name="RM" required />
        </div>

        <div class="form-group">
          <label>Age of Property (%) (AGE) [0 - 100]</label>
          <input
            type="number"
            step="any"
            min="0"
            max="100"
            name="AGE"
            required
          />
        </div>

        <div class="form-group">
          <label>Distance to Employment Centers (DIS) [1 - 13]</label>
          <input
            type="number"
            step="any"
            min="1"
            max="13"
            name="DIS"
            required
          />
        </div>

        <div class="form-group">
          <label>Accessibility to Highways (RAD) [1 - 24]</label>
          <input type="number" min="1" max="24" name="RAD" required />
        </div>

        <div class="form-group">
          <label>Property Tax Rate (TAX) [180 - 720]</label>
          <input type="number" min="180" max="720" name="TAX" required />
        </div>

        <div class="form-group">
          <label>Pupil-Teacher Ratio (PTRATIO) [12 - 23]</label>
          <input
            type="number"
            step="any"
            min="12"
            max="23"
            name="PTRATIO"
            required
          />
        </div>

        <div class="form-group">
          <label>Black Population Index (B) [0 - 400]</label>
          <input type="number" step="any" min="0" max="400" name="B" required />
        </div>

        <div class="form-group">
          <label>Lower Status Population (%) (LSTAT) [1 - 40]</label>
          <input
            type="number"
            step="any"
            min="1"
            max="40"
            name="LSTAT"
            required
          />
        </div>

        <button type="submit">Predict House Price</button>
      </form>

      <div class="prediction">
        {% if prediction_text %} {{ prediction_text }} {% else %} Enter the
        feature values and click "Predict House Price" {% endif %}
      </div>
    </div>
  </body>
</html>
